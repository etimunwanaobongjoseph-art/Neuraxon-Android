
name: Build Neuraxon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o NeuraxonAndroid-Source.zip -d .
          ls -la

      - name: Build APK
        run: |
          gradle -p NeuraxonAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neuraxon-debug-apk
          path: NeuraxonAndroid/app/build/outputs/apk/debug/*.apk
          
